<svg
    width="850"
    height="500"
    viewBox="0 0 850 500"
    xmlns="http://www.w3.org/2000/svg"
>

    <rect
        width="850"
        height="500"
        rx="14"
        fill="#1a1b26"
    />

    <!-- Terminal Header -->

    <rect
        width="850"
        height="45"
        rx="14"
        fill="#16161e"
    />

    <circle cx="30" cy="22" r="7" fill="#f7768e"/>
    <circle cx="55" cy="22" r="7" fill="#e0af68"/>
    <circle cx="80" cy="22" r="7" fill="#9ece6a"/>

    <text
        x="425"
        y="28"
        text-anchor="middle"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#c0caf5"
    >
        swayam5342@github
    </text>


    <!-- Title -->

    <text
        x="40"
        y="85"
        font-family="Fira Code, monospace"
        font-size="24"
        font-weight="bold"
        fill="#7aa2f7"
    >
        $ whoami
    </text>

    <text
        x="40"
        y="120"
        font-family="Fira Code, monospace"
        font-size="18"
        fill="#c0caf5"
    >
        {{NAME}}
    </text>


    <text
        x="40"
        y="155"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#bb9af7"
    >
        {{ROLE}}
    </text>


    <!-- Divider -->

    <line
        x1="40"
        y1="180"
        x2="810"
        y2="180"
        stroke="#414868"
        stroke-width="2"
    />


    <!-- GitHub Stats -->

    <text
        x="40"
        y="215"
        font-family="Fira Code, monospace"
        font-size="20"
        fill="#7dcfff"
    >
        $ github --stats
    </text>


    <text
        x="60"
        y="255"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#9ece6a"
    >
        Repositories
    </text>

    <text
        x="760"
        y="255"
        text-anchor="end"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#c0caf5"
    >
        {{REPOSITORIES}}
    </text>


    <text
        x="60"
        y="290"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#e0af68"
    >
        Contributions
    </text>

    <text
        x="760"
        y="290"
        text-anchor="end"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#c0caf5"
    >
        {{CONTRIBUTIONS}}
    </text>


    <text
        x="60"
        y="325"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#bb9af7"
    >
        Stars Received
    </text>

    <text
        x="760"
        y="325"
        text-anchor="end"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#c0caf5"
    >
        {{STARS}}
    </text>


    <text
        x="60"
        y="360"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#7aa2f7"
    >
        Followers
    </text>

    <text
        x="760"
        y="360"
        text-anchor="end"
        font-family="Fira Code, monospace"
        font-size="16"
        fill="#c0caf5"
    >
        {{FOLLOWERS}}
    </text>


    <!-- Current Status -->

    <line
        x1="40"
        y1="385"
        x2="810"
        y2="385"
        stroke="#414868"
        stroke-width="2"
    />


    <text
        x="40"
        y="420"
        font-family="Fira Code, monospace"
        font-size="18"
        fill="#7dcfff"
    >
        $ currently
    </text>


    <text
        x="60"
        y="450"
        font-family="Fira Code, monospace"
        font-size="14"
        fill="#c0caf5"
    >
        &gt; {{CURRENT_1}}
    </text>


    <text
        x="60"
        y="475"
        font-family="Fira Code, monospace"
        font-size="14"
        fill="#c0caf5"
    >
        &gt; {{CURRENT_2}}
    </text>

</svg>